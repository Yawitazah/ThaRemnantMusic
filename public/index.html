<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tha Remnant Music Group — Label Command Center</title>
<meta name="description" content="Live label dashboard: roster, catalog, album ledger, 90-day playbook, budget and weekly tracking.">
<meta name="theme-color" content="#111110">
<!-- Rich preview when the link is shared in texts, email or social. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tha Remnant Music Group">
<meta property="og:title" content="Tha Remnant Music Group — Label Command Center">
<meta property="og:description" content="Live label dashboard: roster, catalog, album ledger, 90-day playbook, budget and weekly tracking.">
<meta property="og:url" content="https://command-center-production-cc6b.up.railway.app/">
<meta property="og:image" content="https://command-center-production-cc6b.up.railway.app/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/logo-mark-180.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="mark" src="/img/logo-mark-180.png" alt="Tha Remnant Music Group">
    <div>
      <h1>Tha Remnant Music Group</h1>
      <p class="sub">Label Command Center</p>
    </div>
  </div>
  <div class="topbar-actions">
    <span id="sync-state" class="sync" title="Data source">connecting…</span>
    <button id="bell-btn" class="btn ghost bell" type="button" aria-label="Hub activity">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="bell-count" class="bell-count" hidden></span>
    </button>
    <button id="theme-btn" class="btn ghost" type="button" aria-label="Toggle theme">Light</button>
  </div>
  <div id="bell-panel" class="bell-panel" hidden>
    <div class="spread" style="padding:12px 14px 8px">
      <strong style="font-size:.88rem">Hub activity</strong>
      <button id="bell-clear" class="btn sm ghost" type="button">Mark read</button>
    </div>
    <ul id="bell-list"></ul>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab is-active" data-t="now"  role="tab">Now Pushing</button>
  <button class="tab" data-t="artists"   role="tab">Artists</button>
  <button class="tab" data-t="executive" role="tab">Executive Brief</button>
  <button class="tab" data-t="diagnosis" role="tab">Diagnosis</button>
  <button class="tab" data-t="roster"    role="tab">Roster</button>
  <button class="tab" data-t="platforms" role="tab">Platforms &amp; Identity</button>
  <button class="tab" data-t="player"    role="tab">Player</button>
  <button class="tab" data-t="catalog"   role="tab">Catalog</button>
  <button class="tab" data-t="ledger"    role="tab">Album Ledger</button>
  <button class="tab" data-t="playbook"  role="tab">90-Day Playbook</button>
  <button class="tab" data-t="opps"      role="tab">Opportunity Board</button>
  <button class="tab" data-t="budget"    role="tab">Budget &amp; Goal</button>
  <button class="tab" data-t="tracker"   role="tab">Weekly Tracker</button>
</nav>

<main id="view" class="view" role="tabpanel">
  <div class="loading">
    <img class="loading-mark" src="/img/logo-mark-180.png" alt="">
    Loading label data…
  </div>
</main>

<footer class="foot">
  <span>Figures scraped live 2 Aug 2026 · re-pull anything older than a couple of weeks.</span>
  <span id="foot-counts"></span>
  <span id="foot-auth"></span>
</footer>

<div id="tip" class="tip" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
